<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💕</title>

<style>
/* ---------- GLOBAL ---------- */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    height: 100vh;
    overflow: hidden;
    background: linear-gradient(120deg, #f7c1d9 0%, #ffe1f0 40%, #ffd6e8 100%);
    background-size: 300% 300%;
    font-family: 'Segoe UI', sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
}

@keyframes bgShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ---------- FLOATING HEARTS ---------- */
.hearts {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
}

.heart {
    position: absolute;
    bottom: -20px;
    color: #ff69b4;
    font-size: 16px;
    animation: floatUp linear infinite;
    opacity: 0.8;
}

@keyframes floatUp {
    from {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    to {
        transform: translateY(-110vh) scale(1.5);
        opacity: 0;
    }
}

/* ---------- MAIN CONTENT ---------- */
.container {
    text-align: center;
    z-index: 2;
    padding: 20px;
}

.main-text {
    font-size: 38px;
    color: #c2185b;
    font-weight: 600;
    margin-bottom: 30px;
}

.main-text span.heart-symbol {
    font-size: 42px;
}

.container { animation: fadeIn 800ms ease; }

@keyframes fadeIn { from { transform: translateY(10px); opacity: 0 } to { transform: translateY(0); opacity: 1 } }

/* ---------- BUTTONS ---------- */
.buttons {
    margin: 20px 0 35px;
}

.buttons button {
    padding: 12px 35px;
    margin: 0 15px;
    font-size: 18px;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    transition: all 0.3s ease;
}

.yes-btn {
    background-color: #ff4d6d;
    color: white;
}

.yes-btn:hover {
    background-color: #e63956;
    transform: scale(1.1);
}

.no-btn {
    background-color: #ffffff;
    color: #ff4d6d;
    border: 2px solid #ff4d6d;
}

.no-btn:hover {
    transform: translateX(20px);
}

/* ---------- QUOTE ---------- */
.quote {
    font-size: 20px;
    color: #ff4f9a;
    margin-top: 15px;
}
/* Surprise overlay */
#surpriseOverlay {
    position: fixed;
    inset: 0;
    /* romantic animated gradient + subtle blur */
    background: linear-gradient(135deg, rgba(255,182,193,0.95) 0%, rgba(255,218,233,0.92) 40%, rgba(255,192,203,0.94) 100%);
    background-size: 240% 240%;
    animation: overlayShift 12s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    visibility: hidden;
    opacity: 0;
    transition: opacity 300ms ease, visibility 300ms ease;
    backdrop-filter: blur(6px);
}

@keyframes overlayShift {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

#surpriseOverlay.show { visibility: visible; opacity: 1; }

/* intensified background effects */
.overlay-bokeh { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:2 }
.overlay-bokeh .bokeh { position:absolute; border-radius:50%; filter: blur(18px); opacity:0.55; mix-blend-mode: screen; transform: translate3d(0,0,0); }
.overlay-bokeh-full { position:absolute; inset:0; pointer-events:none; overflow:hidden; z-index:0 }
.overlay-bokeh-full .bokeh { position:absolute; border-radius:50%; filter: blur(32px); opacity:0.6; mix-blend-mode: screen; transform: translate3d(0,0,0); }
@keyframes bokehDrift { 0% { transform: translateY(0) scale(1); opacity:0.6 } 50% { opacity:0.9 } 100% { transform: translateY(-260px) scale(1.18); opacity:0 } }

/* stronger card glow */
#surpriseCard { box-shadow: 0 28px 90px rgba(194,41,99,0.22), inset 0 1px 0 rgba(255,255,255,0.6); }

#surpriseCard {
    position: relative;
    width: min(640px, 90%);
    height: min(420px, 70%);
    background: rgba(255, 245, 250, 0.92);
    border-radius: 18px;
    border: 1px solid rgba(255, 120, 140, 0.08);
    box-shadow: 0 18px 50px rgba(194, 41, 99, 0.18);
    overflow: hidden;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:20px;
}

#proceedBtn {
    margin-top: 18px;
    padding: 10px 20px;
    border-radius: 24px;
    border: none;
    background: #ff4d6d;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
}

canvas.confetti { position:absolute; inset:0; width:100%; height:100%; pointer-events:none }
/* Stickers */
.sticker-btns { display:flex; gap:8px; justify-content:center; margin-top:12px; flex-wrap:wrap }
.sticker-btn { padding:8px 10px; border-radius:12px; background:rgba(255,255,255,0.9); border:1px solid #ffd6e0; cursor:pointer; font-size:20px }
.sticker { position:absolute; font-size:40px; pointer-events:auto; transform-origin:center; animation:stickerPop 420ms ease-out; }
@keyframes stickerPop { 0% { transform: scale(0.2) rotate(-10deg); opacity:0 } 60% { transform: scale(1.05) rotate(6deg); opacity:1 } 100% { transform: scale(1) rotate(0deg); opacity:1 } }
.sticker.float { animation: floatAway 4200ms linear forwards; }
@keyframes floatAway { 0% { transform: translateY(0) rotate(0deg); opacity:1 } 100% { transform: translateY(-260px) rotate(240deg); opacity:0 } }
</style>
</head>

<body>

<!-- Floating hearts -->
<div class="hearts" id="hearts"></div>

<!-- Surprise overlay (hidden until Yes clicked) -->
<div id="surpriseOverlay">
    <div class="overlay-bokeh-full" id="overlayFullBokeh"></div>
    <div id="surpriseCard">
        <canvas class="confetti" id="confettiCanvas"></canvas>
        <div class="overlay-bokeh" id="overlayBokeh"></div>
        <div id="surpriseIntro" style="z-index:2; text-align:center;">
            <h2 style="color:#c2185b; margin-bottom:6px">Surprise! 💖</h2>
            <p style="color:#ff4f9a;">I'm so happy you said yes — let's celebrate!</p>
            <button id="proceedBtn">Open your surprise</button>
        </div>

        <div id="surpriseContent" style="display:none; z-index:2; text-align:center;">
            <h2 id="revealTitle" style="color:#c2185b; margin-bottom:6px">For you, my love</h2>
            <div id="typewriter" style="font-size:18px;color:#c2185b; min-height:56px; margin-top:8px"></div>
            <div id="surpriseGraphic" style="font-size:72px; margin-top:12px">💖</div>
            <div style="margin-top:14px; display:flex; gap:12px; justify-content:center;">
                <button id="replayBtn" style="padding:8px 14px; border-radius:18px; border:none; background:#ff7b9b; color:#fff; cursor:pointer">Play again</button>
                <button id="closeBtn" style="padding:8px 14px; border-radius:18px; border:2px solid #ff4d6d; background:#fff; color:#ff4d6d; cursor:pointer">Close</button>
            </div>

            <div style="margin-top:10px;">
                <div style="font-size:13px; color:#b93a63; margin-bottom:6px">Tap a sticker to sprinkle some cuteness</div>
                <div class="sticker-btns" id="stickerTray">
                    <button class="sticker-btn" data-emoji="🌹">🌹</button>
                    <button class="sticker-btn" data-emoji="🐻">🐻</button>
                    <button class="sticker-btn" data-emoji="🎈">🎈</button>
                    <button class="sticker-btn" data-emoji="🍰">🍰</button>
                    <button class="sticker-btn" data-emoji="✨">✨</button>
                    <button class="sticker-btn" data-emoji="🥰">🥰</button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Main Content -->
<div class="container">
    <div class="main-text">
        <span class="heart-symbol">💗</span>
         will you be my Valentine
        <span class="heart-symbol">💗</span>
    </div>

    <div class="buttons">
        <button class="yes-btn" onclick="goYes()">Yes 💖</button>
        <button class="no-btn" onclick="goNo()">No 🙈</button>
    </div>

    <div class="quote">
        "Every moment with you feels like a dream come true"
    </div>
</div>

<script>
/* ---------- HEART GENERATOR ---------- */
const heartsContainer = document.getElementById("hearts");

function createHeart() {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💗";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (3 + Math.random() * 4) + "s";
    heart.style.fontSize = (12 + Math.random() * 18) + "px";
    heartsContainer.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 7000);
}

setInterval(createHeart, 220);

// animate background
document.body.style.animation = 'bgShift 10s ease infinite';

/* ---------- SURPRISE / CONFETTI ---------- */
const surpriseOverlay = document.getElementById('surpriseOverlay');
const confettiCanvas = document.getElementById('confettiCanvas');
const proceedBtn = document.getElementById('proceedBtn');
let confettiCtx, confettiParticles = [], confettiAnim;

function setupConfetti() {
    confettiCanvas.width = confettiCanvas.clientWidth;
    confettiCanvas.height = confettiCanvas.clientHeight;
    confettiCtx = confettiCanvas.getContext('2d');
}

function spawnConfetti(count=120) {
    confettiParticles = [];
    for (let i=0;i<count;i++) {
        confettiParticles.push({
            x: Math.random()*confettiCanvas.width,
            y: Math.random()*confettiCanvas.height/2,
            r: 4 + Math.random()*8,
            dx: -3 + Math.random()*6,
            dy: 2 + Math.random()*6,
            color: `hsl(${Math.random()*360},80%,60%)`,
            rot: Math.random()*360,
            dr: -6 + Math.random()*12
        });
    }
}

function renderConfetti() {
    confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
    for (let p of confettiParticles) {
        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rot*Math.PI/180);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.r/2, -p.r/2, p.r, p.r*0.6);
        confettiCtx.restore();

        p.x += p.dx; p.y += p.dy; p.rot += p.dr;
        p.dy += 0.12; // gravity
    }
    confettiParticles = confettiParticles.filter(p => p.y < confettiCanvas.height+50);
    if (confettiParticles.length) confettiAnim = requestAnimationFrame(renderConfetti);
}

function fireConfetti(duration=3200) {
    setupConfetti();
    spawnConfetti(180);
    renderConfetti();
    setTimeout(()=>{ cancelAnimationFrame(confettiAnim); confettiParticles = []; confettiCtx && confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height); }, duration);
}

// small celebratory melody using WebAudio
function playMelody() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        let t = ctx.currentTime;
        for (let i=0;i<8;i++) {
            const o = ctx.createOscillator();
            const g = ctx.createGain();
            o.type = 'sine'; o.frequency.value = notes[i%notes.length];
            g.gain.value = 0.06;
            o.connect(g); g.connect(ctx.destination);
            o.start(t);
            o.stop(t+0.18);
            t += 0.18;
        }
    } catch(e) { /* audio may be blocked until user gesture */ }
}

/* ---------- BUTTON ACTIONS ---------- */
function goYes() {
    // show overlay, fire confetti, play music, then let user proceed
    surpriseOverlay.classList.add('show');
    fireConfetti(3800);
    playMelody();
    proceedBtn.focus();
    spawnBokeh(20);
    spawnGlobalBokeh(28);
}

function goNo() {
    alert("Nice try 😜 You can't say no!");
}

// proceed to actual yes page
proceedBtn.addEventListener('click', revealSurprise);

function revealSurprise() {
    const intro = document.getElementById('surpriseIntro');
    const content = document.getElementById('surpriseContent');
    intro.style.display = 'none';
    content.style.display = 'block';
    setupConfetti();
    fireConfetti(4200);
    playMelody();
    startTypewriter();
    spawnBokeh(18);
    spawnGlobalBokeh(22);
}

// Typewriter messages
const _messages = [
    "You're my sunshine on rainy days.",
    "I love you more each day.",
    "Happy Valentine's Day — forever yours. 💕"
];
let _mIndex = 0;
function startTypewriter(){
    _mIndex = 0;
    document.getElementById('typewriter').textContent = '';
    typeNextMessage();
}
function typeNextMessage(){
    if(_mIndex >= _messages.length) return showRevealButtons();
    const el = document.getElementById('typewriter');
    const msg = _messages[_mIndex];
    let i = 0;
    el.textContent = '';
    const t = setInterval(()=>{
        el.textContent += msg.charAt(i);
        i++;
        if(i >= msg.length){ clearInterval(t); _mIndex++; setTimeout(typeNextMessage, 700); }
    }, 40);
}

function showRevealButtons(){
    // buttons already visible — nothing extra needed, kept for future expansion
}

// replay and close handlers
document.addEventListener('click', (e)=>{
    if(e.target && e.target.id === 'replayBtn'){
        setupConfetti(); fireConfetti(3800); playMelody(); startTypewriter();
    }
    if(e.target && e.target.id === 'closeBtn'){
        // reset overlay
        const intro = document.getElementById('surpriseIntro');
        const content = document.getElementById('surpriseContent');
        content.style.display = 'none';
        intro.style.display = 'block';
        surpriseOverlay.classList.remove('show');
        cancelAnimationFrame(confettiAnim);
        confettiCtx && confettiCtx.clearRect(0,0,confettiCanvas.width, confettiCanvas.height);
        clearGlobalBokeh();
    }
});

// Stickers: spawn animated emoji stickers inside surpriseCard
const stickerTray = document.getElementById('stickerTray');
function createSticker(emoji, count=6){
    const card = document.getElementById('surpriseCard');
    for(let i=0;i<count;i++){
        const s = document.createElement('div');
        s.className = 'sticker';
        s.textContent = emoji;
        // random start within card
        const pad = 30;
        const rw = card.clientWidth - pad*2;
        const rh = card.clientHeight - pad*2;
        s.style.left = (pad + Math.random()*rw) + 'px';
        s.style.top = (pad + Math.random()*rh) + 'px';
        card.appendChild(s);
        // schedule float away
        requestAnimationFrame(()=> s.classList.add('float'));
        // remove after animation
        setTimeout(()=>{ s.remove(); }, 4600 + Math.random()*800);
        // click to pop instantly
        s.addEventListener('click', ()=>{ s.remove(); });
    }
}

stickerTray && stickerTray.querySelectorAll('.sticker-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{ createSticker(btn.dataset.emoji, 6); });
});

// Bokeh: intensified romantic floating lights
const overlayBokeh = document.getElementById('overlayBokeh');
let bokehNodes = [];
function spawnBokeh(count=18){
    if(!overlayBokeh) return;
    // clear existing
    bokehNodes.forEach(n=>n.remove()); bokehNodes = [];
    const palette = ['rgba(255,182,193,0.75)','rgba(255,150,177,0.7)','rgba(242,198,255,0.6)','rgba(255,209,186,0.6)'];
    for(let i=0;i<count;i++){
        const b = document.createElement('div');
        b.className = 'bokeh';
        const size = 80 + Math.random()*220;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (Math.random()*110 - 5) + '%';
        b.style.top = (60 + Math.random()*30) + '%';
        b.style.background = palette[Math.floor(Math.random()*palette.length)];
        b.style.animation = `bokehDrift ${10 + Math.random()*12}s linear forwards`;
        b.style.opacity = 0.4 + Math.random()*0.6;
        overlayBokeh.appendChild(b);
        bokehNodes.push(b);
    }
}

// Full-screen global bokeh (covers entire overlay)
const overlayFullBokeh = document.getElementById('overlayFullBokeh');
let globalBokehNodes = [];
function spawnGlobalBokeh(count=24){
    if(!overlayFullBokeh) return;
    // clear any previous
    globalBokehNodes.forEach(n=>n.remove()); globalBokehNodes = [];
    const palette = ['rgba(255,120,150,0.55)','rgba(220,120,170,0.48)','rgba(255,200,220,0.45)','rgba(240,180,255,0.42)'];
    for(let i=0;i<count;i++){
        const b = document.createElement('div');
        b.className = 'bokeh';
        const size = 140 + Math.random()*260;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (Math.random()*110 - 5) + '%';
        b.style.top = (Math.random()*110 - 5) + '%';
        b.style.background = palette[Math.floor(Math.random()*palette.length)];
        b.style.animation = `bokehDrift ${12 + Math.random()*14}s linear forwards`;
        b.style.opacity = 0.35 + Math.random()*0.55;
        overlayFullBokeh.appendChild(b);
        globalBokehNodes.push(b);
    }
}

function clearGlobalBokeh(){ globalBokehNodes.forEach(n=>n.remove()); globalBokehNodes = []; }

// remove bokeh when overlay closed
function clearBokeh(){ bokehNodes.forEach(n=>n.remove()); bokehNodes = []; }

// clear bokeh on close button
document.addEventListener('click', (e)=>{
    if(e.target && e.target.id === 'closeBtn'){
        clearBokeh();
    }
});

// make overlay responsive on resize
window.addEventListener('resize', ()=>{ if (surpriseOverlay.classList.contains('show')) setupConfetti(); });

/* ---------- NO BUTTON DODGE ---------- */
/* ---------- NO BUTTON PROXIMITY MESSAGES & DODGE ---------- */
const noBtn = document.querySelector('.no-btn');
noBtn.style.position = 'relative';

const noMessages = [
    "wait are you sure ?",
    "really",
    "try again",
    "you sure?",
    "nice try ^",
    "no escape %",
    "nice try 😊",
    "you can't escape sanju ❤️",
    "still no? really 😄",
    "you're testing my patience 🥺",
    "nope not happening"
];

let noIndex = 0;
let lastChange = 0;
const proximityThreshold = 140; // px

document.addEventListener('mousemove', (e) => {
    const rect = noBtn.getBoundingClientRect();
    const bx = rect.left + rect.width / 2;
    const by = rect.top + rect.height / 2;
    const dx = e.clientX - bx;
    const dy = e.clientY - by;
    const dist = Math.sqrt(dx*dx + dy*dy);

    // when cursor is near, cycle message and dodge (1s debounce)
    if (dist < proximityThreshold && Date.now() - lastChange > 1000) {
        noBtn.textContent = noMessages[noIndex % noMessages.length];
        noIndex++;
        lastChange = Date.now();

        // dodge by translating randomly but keeping within viewport-ish
        const shiftX = (Math.random() * 260) - 130; // -130..130
        const shiftY = (Math.random() * 120) - 60;
        noBtn.style.transform = `translate(${shiftX}px, ${shiftY}px)`;
    }

    // restore default label when cursor moves away
    if (dist >= proximityThreshold && Date.now() - lastChange > 1000) {
        noBtn.textContent = 'No 🙈';
        noBtn.style.transform = '';
    }
});

noBtn.addEventListener('click', ()=>{
    // playful fallback pop
    noBtn.style.transform = (noBtn.style.transform ? noBtn.style.transform + ' scale(0.92)' : 'scale(0.92)');
    setTimeout(()=>{ noBtn.style.transform = ''; }, 260);
});
</script>

</body>
</html>
